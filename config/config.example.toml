template_image = "../template.png"
type_template_image = "../templates/template-1.png"
studio_template_image = "../templates/template-3.png"
admin_template_image = "../templates/template-2.png"
type_collections_file = "./types-collections.txt"
studio_collections_file = "./studio-collections.txt"
admin_collections_file = "./admin-collections.txt"
output_dir = "../output"
log_file = "../logs/frantic-postr.log"
plex_config = "./config.plex.toml"

label_config = "./labels.toml"
collection_config = "./collections.toml"

[plex]
retries = 3
workers = 1
retry_base_ms = 1000
retry_max_ms = 30000


[clean.replacements]
"&" = " and "
"£" = " gbp "
"$" = " usd "
"FULL MOVIE" = " "

[clean]
translate_api_http_address = "https://libretranslate.com/translate"
translate_endpoint = "https://libretranslate.com/translate"
translate_api_key = ""
translate_rate_limit_per_minute = 10

[stats]
exclude_words = ["xxx", "sample"]

[font]
file = ""
size = 64
color = "#FFFFFF"
shadow_color = "#000000"
shadow_offset_x = 2
shadow_offset_y = 2
glow_color = "#000000"
glow_radius = 3
glow_alpha = 0.35
y_offset = 0
