services:
  frantic-postr:
    image: mt1976/frantic-postr:latest
    container_name: frantic-postr
    ports:
      - "5080:8080"
    working_dir: /data
    environment:
      FRANTIC_POSTR_DATA_DIR: /data
      FRANTIC_POSTR_PORT: "8080"
      TZ: UTC
    volumes:
      - ./docker-data:/data
    restart: unless-stopped
    command: ["/app/frantic-postr", "-config", "/data/config/config.toml", "-web", "-port", "8080"]
